name: Shorts Automation

on:
  workflow_dispatch:
  schedule:
    # Run every 4 hours for up to 6 daily Shorts uploads.
    - cron: "0 */4 * * *"

permissions:
  contents: write

jobs:
  run-shorts-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core

      - name: Restore runtime secrets
        env:
          APP_ENV_BASE64: ${{ secrets.APP_ENV_BASE64 }}
          CLIENT_SECRETS_JSON_BASE64: ${{ secrets.CLIENT_SECRETS_JSON_BASE64 }}
          YOUTUBE_TOKEN_PICKLE_BASE64: ${{ secrets.YOUTUBE_TOKEN_PICKLE_BASE64 }}
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          required = {
              ".env": os.environ.get("APP_ENV_BASE64"),
              "client_secrets.json": os.environ.get("CLIENT_SECRETS_JSON_BASE64"),
              "token.pickle": os.environ.get("YOUTUBE_TOKEN_PICKLE_BASE64"),
          }

          for target, value in required.items():
              if not value:
                  raise SystemExit(f"Missing required secret payload for {target}")
              Path(target).write_bytes(base64.b64decode(value))
          PY

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automated upload pipeline
        run: python main.py

      - name: Commit updated posted log
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update posted articles log"
          file_pattern: posted_articles.json
